[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-standards-converter"
version = "8.0.0"
description = "Converter between standards for different biological metadata repositories."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "jaychowcl", email = "jaychowcl@gmail.com" },
]
maintainers = [
  { name = "jaychowcl", email = "jaychowcl@gmail.com" },
]
keywords = [
  "metadata",
  "bioinformatics",
  "GEO",
  "ArrayExpress",
  "MAGE-TAB",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "python-dateutil>=2.9.0.post0,<3",
  "requests>=2.34.2,<3",
]

[project.optional-dependencies]
h5ad = [
  "anndata>=0.13.4,<1",
  "h5py>=3.16.0,<4",
  "numpy>=2.5.3,<3",
  "pandas>=3.0.6,<4",
  "scanpy>=1.12.4,<2",
  "scipy>=1.18.1,<2",
]
test = [
  "pytest>=9.1.1,<10",
  "anndata>=0.13.4,<1",
  "h5py>=3.16.0,<4",
  "numpy>=2.5.3,<3",
  "pandas>=3.0.6,<4",
  "scanpy>=1.12.4,<2",
  "scipy>=1.18.1,<2",
]

[project.urls]
Homepage = "https://github.com/jaychowcl/meta_standards_converter"
Repository = "https://github.com/jaychowcl/meta_standards_converter"
Issues = "https://github.com/jaychowcl/meta_standards_converter/issues"

[project.scripts]
msc-convert = "meta_standards_converter.cli.convert:main"
sra2json = "meta_standards_converter.cli.sra2json:main"
ena2json = "meta_standards_converter.cli.ena2json:main"
ae2json = "meta_standards_converter.cli.ae2json:main"
geo2ae = "meta_standards_converter.cli.geo2ae:main"
geo2json = "meta_standards_converter.cli.geo2json:main"
json2ae = "meta_standards_converter.cli.json2ae:main"
json2h5ad = "meta_standards_converter.cli.json2h5ad:main"
json2tsv = "meta_standards_converter.cli.json2tsv:main"
json2obs = "meta_standards_converter.cli.json2obs:main"
miniml-migrate = "meta_standards_converter.cli.miniml_migrate:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["meta_standards_converter*"]

[tool.pytest.ini_options]
markers = [
  "fake_process: reviewed shell test using a bounded fake PATH",
]
