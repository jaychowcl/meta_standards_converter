[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-standards-converter"
version = "1.0.0"
description = "Converter between standards for different biological metadata repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "jaychowcl", email = "jaychowcl@gmail.com" },
]
maintainers = [
  { name = "jaychowcl", email = "jaychowcl@gmail.com" },
]
keywords = [
  "metadata",
  "bioinformatics",
  "GEO",
  "ArrayExpress",
  "MAGE-TAB",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "python-dateutil>=2.8.2,<3",
  "requests>=2.31.0,<3",
]

[project.optional-dependencies]
h5ad = [
  "anndata>=0.10.8,<1",
  "h5py>=3.10.0,<4",
  "numpy>=1.26.0,<3",
  "pandas>=2.1.0,<4",
  "scanpy>=1.10.0,<2",
  "scipy>=1.11.0,<2",
]
test = [
  "pytest>=8.2,<9",
  "pytest-subtests>=0.14,<1",
  "anndata>=0.10.8,<1",
  "h5py>=3.10.0,<4",
  "numpy>=1.26.0,<3",
  "pandas>=2.1.0,<4",
  "scanpy>=1.10.0,<2",
  "scipy>=1.11.0,<2",
]

[project.urls]
Homepage = "https://github.com/jaychowcl/meta_standards_converter"
Repository = "https://github.com/jaychowcl/meta_standards_converter"
Issues = "https://github.com/jaychowcl/meta_standards_converter/issues"

[project.scripts]
ae2json = "meta_standards_converter.cli.ae2json:main"
geo2ae = "meta_standards_converter.cli.geo2ae:main"
geo2json = "meta_standards_converter.cli.geo2json:main"
json2ae = "meta_standards_converter.cli.json2ae:main"
json2h5ad = "meta_standards_converter.cli.json2h5ad:main"
json2tsv = "meta_standards_converter.cli.json2tsv:main"
json2obs = "meta_standards_converter.cli.json2obs:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "fake_process: reviewed shell test using a bounded fake PATH",
]
